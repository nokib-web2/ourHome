<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090e1a" />
    <title>The Gallery of Us</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="webgl" aria-label="A 3D gallery of our memories"></canvas>
    <div class="fx-vignette" aria-hidden="true"></div>
    <div class="fx-grain" aria-hidden="true"></div>

    <header class="hud">
      <a class="brand" href="#"><span class="brand-mono"></span><span class="brand-name"></span></a>
      <button class="sound" type="button" hidden aria-label="Toggle music">
        <span class="bars"><i></i><i></i><i></i><i></i></span><span class="sound-label">Sound</span>
      </button>
    </header>

    <nav class="rooms-nav" aria-label="Rooms"></nav>
    <div class="where"></div>

    <section class="intro">
      <p class="eyebrow intro-since"></p>
      <h1 class="intro-title"></h1>
      <p class="intro-tagline"></p>
    </section>
    <div class="scroll-cue"><span>Scroll to enter</span><i></i></div>

    <section class="chapter" aria-live="polite">
      <p class="eyebrow chapter-num"></p>
      <h2 class="chapter-title"></h2>
      <p class="chapter-sub"></p>
    </section>

    <section class="outro">
      <p class="eyebrow outro-eyebrow"></p>
      <h2 class="outro-title"></h2>
      <p class="outro-text"></p>
      <button class="outro-replay" type="button">Walk through again</button>
    </section>

    <div class="hint"></div>
    <div class="bfly-hint" aria-hidden="true"><i></i><span></span></div>
    <div class="progress"><span></span></div>

    <div class="lightbox" hidden>
      <button class="lb-close" type="button" aria-label="Close">Close</button>
      <figure>
        <img alt="" />
        <video class="lb-video" controls playsinline loop hidden></video>
        <figcaption>
          <p class="eyebrow lb-date"></p>
          <h3 class="lb-title"></h3>
          <p class="lb-story"></p>
        </figcaption>
      </figure>
    </div>

    <div class="loader" id="loader">
      <div class="loader-bg" aria-hidden="true">
        <div class="loader-nebula"></div>
        <div class="loader-stars">
          <i style="--top: 14%; --left: 18%; --size: 2px; --dur: 2.8s; --delay: 0s;"></i>
          <i style="--top: 22%; --left: 78%; --size: 3px; --dur: 3.6s; --delay: 0.5s;"></i>
          <i style="--top: 68%; --left: 12%; --size: 2px; --dur: 4.2s; --delay: 1.2s;"></i>
          <i style="--top: 72%; --left: 84%; --size: 2.5px; --dur: 3.1s; --delay: 0.8s;"></i>
          <i style="--top: 38%; --left: 8%; --size: 2px; --dur: 4.8s; --delay: 1.5s;"></i>
          <i style="--top: 16%; --left: 88%; --size: 2.5px; --dur: 3.9s; --delay: 0.2s;"></i>
          <i style="--top: 82%; --left: 32%; --size: 1.5px; --dur: 3.3s; --delay: 1.8s;"></i>
          <i style="--top: 30%; --left: 64%; --size: 2px; --dur: 4.5s; --delay: 0.9s;"></i>
          <i style="--top: 52%; --left: 92%; --size: 3px; --dur: 2.9s; --delay: 1.1s;"></i>
          <i style="--top: 86%; --left: 68%; --size: 2px; --dur: 3.7s; --delay: 0.4s;"></i>
        </div>
      </div>

      <div class="loader-inner">
        <div class="loader-crest" aria-hidden="true">
          <span class="crest-sparkle top">✦</span>
          <div class="crest-ring">
            <span class="loader-crest-text">Y & M</span>
          </div>
          <span class="crest-sparkle bottom">✦</span>
        </div>

        <p class="eyebrow loader-eyebrow">Welcome to</p>
        <h2 class="loader-title">You <em>&</em> Me</h2>
        <p class="loader-sub">A little gallery of our favourite memories</p>

        <div class="loader-progress-box">
          <div class="loader-bar-wrap">
            <div class="loader-bar"><span></span></div>
          </div>
          <div class="loader-meta">
            <span class="loader-status-text">Gathering our memories...</span>
            <span class="loader-percent">0%</span>
          </div>
        </div>

        <div class="loader-action-box">
          <button class="loader-enter" type="button" disabled aria-label="Enter the gallery">
            <span class="btn-content">
              <span class="btn-sparkle">✦</span>
              <span class="btn-label">Step Into Our Story</span>
              <span class="btn-sparkle">✦</span>
            </span>
          </button>
          <p class="loader-note">
            <svg class="note-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
              <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
            </svg>
            Best experienced with sound on
          </p>
        </div>
      </div>
    </div>

    <div id="scroll-track"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
